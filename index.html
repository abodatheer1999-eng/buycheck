<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفكرة الشراء الخاصة - مكتب أثير العريبي</title>
    <style>
        :root {
            --primary: #008080; /* تركوازي هوية المحل */
            --primary-dark: #006666;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #222222;
            --border: #dce4e2;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .header {
            background: var(--primary); color: white; padding: 15px;
            border-radius: 12px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header h1 { margin: 0; font-size: 1.2rem; }
        .header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
        .btn-key {
            background: rgba(255,255,255,0.2); border: 1px solid white;
            color: white; padding: 8px 12px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }
        .card {
            background: var(--card); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; border: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }
        .key-box { display: none; border: 2px solid var(--primary); }
        .key-box.active { display: block; }
        .input-group { display: flex; gap: 8px; margin-top: 10px; }
        input[type="text"], input[type="password"], textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.95rem;
        }
        .btn-primary {
            background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; width: 100%;
            font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-primary:disabled { background: #99b8b8; cursor: not-allowed; }
        .btn-small {
            background: var(--primary); color: white; border: none;
            padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab {
            flex: 1; padding: 10px; text-align: center; background: white;
            border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .hidden { display: none; }
        .result-box {
            margin-top: 15px; padding: 12px; background: #e8f5f5;
            border-right: 4px solid var(--primary); border-radius: 8px;
            white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem;
        }
        .status { font-size: 0.85rem; color: var(--primary); margin-top: 6px; font-weight: bold; }
        .error { color: #d93025; background: #fce8e6; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>مفكرة الشراء الخاصة - أبو فيروزة</h1>
            <p>فحص سريع بالصورة أو النص قبل الشراء</p>
        </div>
        <button type="button" class="btn-key" id="toggleKeyBtn">⚙️ المفتاح</button>
    </div>

    <!-- صندوق إدخال المفتاح -->
    <div class="card key-box" id="keySection">
        <strong>مفتاح Gemini API Key:</strong>
        <div class="input-group">
            <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا (AIzaSy...)">
            <button type="button" class="btn-small" id="saveKeyBtn">حفظ</button>
        </div>
        <div class="status" id="keyStatus">محفوظ في جهازك الشخصي فقط.</div>
    </div>

    <!-- التبويبات -->
    <div class="tabs">
        <div class="tab active" id="tabImgBtn">📸 فحص صورة</div>
        <div class="tab" id="tabTxtBtn">📝 نص / قائمة</div>
    </div>

    <!-- قسم فحص الصورة -->
    <div class="card" id="imgSection">
        <label><strong>التقط صورة أو اختر لقطة شاشة لمنتج أو قائمة:</strong></label>
        <input type="file" id="imageInput" accept="image/*" style="margin-top:10px;">
        <input type="text" id="imgNote" placeholder="ملاحظة إضافية (مثلاً: الأسعار بالجملة أو بالدينار)" style="margin-top:10px;">
        <button type="button" class="btn-primary" id="analyzeImgBtn">🔍 استخرج وحلل المنتجات بالصورة</button>
    </div>

    <!-- قسم فحص النص -->
    <div class="card hidden" id="txtSection">
        <label><strong>اكتب اسم المنتج أو الصق قائمة أسعار المورد:</strong></label>
        <textarea id="textInput" rows="4" placeholder="مثال:&#10;مبشرة كهربائية - 7000&#10;منظم بهارات دوار 16 علبة - 14000" style="margin-top:10px;"></textarea>
        <button type="button" class="btn-primary" id="analyzeTxtBtn">📊 افحص وحلل الأسعار الآن</button>
    </div>

    <!-- نتيجة التحليل -->
    <div class="card hidden" id="outputCard">
        <strong>نتيجة التحليل وتوصية الشراء:</strong>
        <div id="outputContent" class="result-box"></div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const keySection = document.getElementById("keySection");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const keyStatus = document.getElementById("keyStatus");
        const toggleKeyBtn = document.getElementById("toggleKeyBtn");
        const saveKeyBtn = document.getElementById("saveKeyBtn");

        const tabImgBtn = document.getElementById("tabImgBtn");
        const tabTxtBtn = document.getElementById("tabTxtBtn");
        const imgSection = document.getElementById("imgSection");
        const txtSection = document.getElementById("txtSection");

        const imageInput = document.getElementById("imageInput");
        const imgNote = document.getElementById("imgNote");
        const analyzeImgBtn = document.getElementById("analyzeImgBtn");

        const textInput = document.getElementById("textInput");
        const analyzeTxtBtn = document.getElementById("analyzeTxtBtn");

        const outputCard = document.getElementById("outputCard");
        const outputContent = document.getElementById("outputContent");

        // تحميل المفتاح المحفوظ أو إظهار الصندوق تلقائياً إذا لم يوجد مفتاح
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) {
            apiKeyInput.value = savedKey;
            keyStatus.textContent = "✅ المفتاح محفوظ وجاهز للعمل.";
        } else {
            keySection.classList.add("active");
            keyStatus.textContent = "⚠️ يرجى لصق مفتاح Gemini API والضغط على حفظ.";
        }

        // فتح/إغلاق خانة المفتاح
        toggleKeyBtn.addEventListener("click", () => {
            keySection.classList.toggle("active");
        });

        // حفظ المفتاح
        saveKeyBtn.addEventListener("click", () => {
            const val = apiKeyInput.value.trim();
            if (!val) {
                alert("الرجاء لصق المفتاح أولاً!");
                return;
            }
            localStorage.setItem("gemini_api_key", val);
            keyStatus.textContent = "✅ تم حفظ المفتاح بنجاح!";
            setTimeout(() => keySection.classList.remove("active"), 1000);
        });

        // التبديل بين الصورة والنص
        tabImgBtn.addEventListener("click", () => {
            tabImgBtn.classList.add("active");
            tabTxtBtn.classList.remove("active");
            imgSection.classList.remove("hidden");
            txtSection.classList.add("hidden");
        });

        tabTxtBtn.addEventListener("click", () => {
            tabTxtBtn.classList.add("active");
            tabImgBtn.classList.remove("active");
            txtSection.classList.remove("hidden");
            imgSection.classList.add("hidden");
        });

        // تحويل الصورة إلى Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // الاتصال بـ Gemini API
        async function callGemini(parts) {
            const apiKey = localStorage.getItem("gemini_api_key");
            if (!apiKey) {
                keySection.classList.add("active");
                alert("يرجى إدخال وحفظ مفتاح Gemini API أولاً.");
                return;
            }

            outputCard.classList.remove("hidden");
            outputContent.className = "result-box";
            outputContent.textContent = "⏳ جاري تحليل البيانات والأسعار...";

            const systemPrompt = "أنت مساعد مشتريات ذكي لمكتب أثير العريبي لتجارة المواد المنزلية والديكور في الموصل. استخرج أسماء المنتجات، الكود، التعبئة، والأسعار بدقة، ثم قارن الجدوى التجارية وقدم توصية واضحة للشراء باللغة العربية.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }, ...parts] }]
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error?.message || "حدث خطأ في الاتصال بالخادم");
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "لم يتم استلام رد واضح.";
                outputContent.textContent = reply;
            } catch (err) {
                outputContent.className = "error";
                outputContent.textContent = "❌ خطأ: " + err.message + "\nتأكد من صحة المفتاح أو اتصال الإنترنت.";
            }
        }

        // زر تحليل الصورة
        analyzeImgBtn.addEventListener("click", async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert("يرجى اختيار صورة أولاً!");
                return;
            }
            analyzeImgBtn.disabled = true;
            try {
                const base64Data = await fileToBase64(file);
                const note = imgNote.value.trim() ? `ملاحظة إضافية: ${imgNote.value}` : "استخرج كل المنتجات والأسعار من هذه الصورة وحللها.";
                await callGemini([
                    { text: note },
                    { inlineData: { mimeType: file.type, data: base64Data } }
                ]);
            } finally {
                analyzeImgBtn.disabled = false;
            }
        });

        // زر تحليل النص
        analyzeTxtBtn.addEventListener("click", async () => {
            const txt = textInput.value.trim();
            if (!txt) {
                alert("يرجى كتابة أو لصق النص أولاً!");
                return;
            }
            analyzeTxtBtn.disabled = true;
            try {
                await callGemini([{ text: `حلل قائمة المنتجات والأسعار التالية:\n${txt}` }]);
            } finally {
                analyzeTxtBtn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
