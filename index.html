<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفكرة الشراء الخاصة - أبو فيروزة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #008080;
      --primary-dark: #006666;
      --bg: #f4f7f6;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: #222222;
      margin: 0;
      padding: 0;
    }
    .brand-bg { background-color: var(--primary); }
    .brand-bg:hover { background-color: var(--primary-dark); }
    .brand-text { color: var(--primary); }
    .brand-border { border-color: var(--primary); }
  </style>
</head>
<body class="pb-12">

  <header class="brand-bg text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-extrabold">مفكرة الشراء الخاصة - أبو فيروزة</h1>
        <p class="text-xs text-teal-100">فحص سريع للجملة والمفرد قبل الشراء</p>
      </div>
      <button onclick="toggleSettings()" class="bg-teal-700 hover:bg-teal-800 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 shadow-sm">
        ⚙️ المفاتيح
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">

    <!-- صندوق إدخال المفاتيح -->
    <div id="settingsBox" class="hidden bg-white p-4 rounded-xl shadow border border-teal-200 space-y-3">
      <div>
        <label class="block text-sm font-bold brand-text mb-1">1. مفتاح Gemini API Key (الأساسي):</label>
        <input type="password" id="apiKeyInput" placeholder="ألصق مفتاح جوجل هنا (AIzaSy...)" class="w-full border rounded-lg px-3 py-2 text-sm text-left focus:outline-none focus:border-teal-600" dir="ltr" />
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">2. مفتاح OpenRouter API Key (احتياطي اختياري):</label>
        <input type="password" id="openRouterKeyInput" placeholder="ألصق مفتاح OpenRouter هنا (sk-or-...)" class="w-full border rounded-lg px-3 py-2 text-sm text-left focus:outline-none focus:border-teal-600" dir="ltr" />
        <p class="text-[11px] text-gray-500 mt-1">* يعمل تلقائياً في حال توقف أو انشغال جميع نماذج Gemini.</p>
      </div>

      <div class="flex justify-between items-center pt-1">
        <p class="text-xs text-gray-500">* تُحفظ المفاتيح في متصفحك الشخصي فقط.</p>
        <button onclick="saveKeys()" class="brand-bg text-white px-5 py-2 rounded-lg text-sm font-bold">حفظ المفاتيح</button>
      </div>
    </div>

    <!-- التبويبات -->
    <div class="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-xl shadow-sm">
      <button id="tab-image" onclick="switchTab('image')" class="brand-bg text-white py-2 rounded-lg text-sm font-bold transition">📸 فحص صورة</button>
      <button id="tab-text" onclick="switchTab('text')" class="text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition">📝 نص / قائمة</button>
    </div>

    <!-- قسم فحص الصورة -->
    <div id="section-image" class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <label class="block text-sm font-bold text-gray-700">التقط صورة أو اختر لقطة شاشة لمنتج أو قائمة:</label>
      <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="block w-full text-sm text-gray-600 file:ml-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 border rounded-lg p-1.5" />
      
      <div id="imagePreviewContainer" class="hidden">
        <img id="imagePreview" class="max-h-60 mx-auto rounded-lg border shadow-sm object-contain" />
      </div>

      <input type="text" id="imageNote" placeholder="ملاحظة إضافية (مثلاً: سعر الكرتون 24 قطعة، أو السعر بالدولار)" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-600" />
      
      <button id="btnAnalyzeImage" onclick="analyzeImage()" class="w-full brand-bg text-white py-2.5 rounded-lg font-bold text-sm shadow">
        🔍 استخرج وحلل المنتجات بالصورة
      </button>
    </div>

    <!-- قسم فحص النص -->
    <div id="section-text" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-3">
      <label class="block text-sm font-bold text-gray-700">ألصق قائمة الأسعار أو تفاصيل المنتجات هنا:</label>
      <textarea id="textInput" rows="5" placeholder="مثال:&#10;طقم بهارات 7 قطع بسعر 12,000&#10;ترمس شاي 1 لتر بسعر 9,500" class="w-full border rounded-lg p-3 text-sm focus:outline-none focus:border-teal-600"></textarea>
      
      <button id="btnAnalyzeText" onclick="analyzeText()" class="w-full brand-bg text-white py-2.5 rounded-lg font-bold text-sm shadow">
        🔍 حلل القائمة والأسعار
      </button>
    </div>

    <!-- صندوق النتائج -->
    <div id="resultBox" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-3 border-t-4 brand-border">
      <div class="flex justify-between items-center gap-2">
        <h2 class="font-extrabold text-base brand-text">نتيجة التحليل وتوصية الشراء:</h2>
        <span id="usedModelBadge" class="hidden text-[10px] bg-teal-50 text-teal-700 px-2 py-0.5 rounded-full font-bold" dir="ltr"></span>
      </div>
      
      <div id="loadingMsg" class="hidden text-center py-4 text-sm font-bold text-teal-700">
        ⏳ جاري تحليل الأسعار (جملة ومفرد)...
      </div>
      <div id="errorMsg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-xs font-bold leading-relaxed" dir="ltr"></div>
      
      <div id="tableContainer" class="hidden overflow-x-auto">
        <table class="w-full text-right border-collapse text-xs">
          <thead>
            <tr class="bg-teal-50 text-teal-900 border-b">
              <th class="p-2">المنتج</th>
              <th class="p-2">سعر العرض</th>
              <th class="p-2">سعر الجملة</th>
              <th class="p-2">سعر المفرد</th>
              <th class="p-2">التقييم</th>
            </tr>
          </thead>
          <tbody id="resultTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // النماذج الاحتياطية على OpenRouter (تُستخدم فقط إذا تعطل Gemini أو لم يوجد مفتاح له)
    const OPENROUTER_MODELS = [
      "google/gemini-2.0-flash-exp:free",
      "qwen/qwen-2.5-vl-7b-instruct:free",
      "openai/gpt-4o-mini",
      "anthropic/claude-3.5-haiku"
    ];

    let base64Image = "";
    let imageMimeType = "";

    window.onload = () => {
      const savedGemini = localStorage.getItem("gemini_api_key");
      const savedOR = localStorage.getItem("openrouter_api_key");
      
      if (savedGemini) document.getElementById("apiKeyInput").value = savedGemini;
      if (savedOR) document.getElementById("openRouterKeyInput").value = savedOR;

      if (!savedGemini && !savedOR) {
        document.getElementById("settingsBox").classList.remove("hidden");
      }
    };

    function toggleSettings() {
      document.getElementById("settingsBox").classList.toggle("hidden");
    }

    function saveKeys() {
      const geminiKey = document.getElementById("apiKeyInput").value.trim();
      const orKey = document.getElementById("openRouterKeyInput").value.trim();

      if (!geminiKey && !orKey) {
        return alert("يرجى إدخال مفتاح واحد على الأقل (Gemini أو OpenRouter).");
      }

      localStorage.setItem("gemini_api_key", geminiKey);
      localStorage.setItem("openrouter_api_key", orKey);
      alert("✅ تم حفظ المفاتيح بنجاح!");
      document.getElementById("settingsBox").classList.add("hidden");
    }

    function switchTab(tab) {
      const isImg = tab === "image";
      document.getElementById("section-image").classList.toggle("hidden", !isImg);
      document.getElementById("section-text").classList.toggle("hidden", isImg);
      
      document.getElementById("tab-image").className = isImg 
        ? "brand-bg text-white py-2 rounded-lg text-sm font-bold transition" 
        : "text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition";
      document.getElementById("tab-text").className = !isImg 
        ? "brand-bg text-white py-2 rounded-lg text-sm font-bold transition" 
        : "text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition";
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      imageMimeType = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById("imagePreview").src = e.target.result;
        document.getElementById("imagePreviewContainer").classList.remove("hidden");
        base64Image = e.target.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    async function getAvailableGeminiModels(apiKey) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || "فشل التحقق من مفتاح Gemini.");
      }
      const validModels = (data.models || [])
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name.replace("models/", ""))
        .filter(name => name.includes("gemini") && !name.includes("embedding") && !name.includes("aqa"));
      
      validModels.sort((a, b) => {
        const aFlash = a.includes("flash") ? -1 : 1;
        const bFlash = b.includes("flash") ? -1 : 1;
        return aFlash - bFlash;
      });

      return validModels;
    }

    async function callOpenRouter(promptText, imgBase64 = "", imgMime = "") {
      const orKey = (localStorage.getItem("openrouter_api_key") || "").trim();
      if (!orKey) throw new Error("لا يوجد مفتاح OpenRouter احتياطي.");

      const loadingEl = document.getElementById("loadingMsg");
      let lastOrError = null;

      const userContent = imgBase64
        ? [
            { type: "text", text: promptText },
            { type: "image_url", image_url: { url: `data:${imgMime};base64,${imgBase64}` } }
          ]
        : promptText;

      for (const model of OPENROUTER_MODELS) {
        loadingEl.innerText = `⏳ التحويل للاحتياطي OpenRouter (${model})...`;
        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${orKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": window.location.href,
              "X-Title": "BuyCheck Al-Uraiby"
            },
            body: JSON.stringify({
              model: model,
              messages: [{ role: "user", content: userContent }]
            })
          });

          const data = await response.json();
          if (!response.ok) {
            lastOrError = new Error(`[OpenRouter - ${model}]: ${data.error?.message || "خطأ"}`);
            continue;
          }

          let rawText = data.choices?.[0]?.message?.content || "[]";
          rawText = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();

          const badge = document.getElementById("usedModelBadge");
          badge.innerText = "OR: " + model.split("/").pop();
          badge.classList.remove("hidden");

          return JSON.parse(rawText);
        } catch (err) {
          lastOrError = err;
        }
      }
      throw lastOrError || new Error("تعذر الاتصال بجميع نماذج OpenRouter.");
    }

    async function runAnalysis(promptText, imgBase64 = "", imgMime = "") {
      const geminiKey = (localStorage.getItem("gemini_api_key") || "").trim();
      const orKey = (localStorage.getItem("openrouter_api_key") || "").trim();

      if (!geminiKey && !orKey) {
        document.getElementById("settingsBox").classList.remove("hidden");
        throw new Error("يرجى إدخال مفتاح Gemini أو OpenRouter أولاً.");
      }

      const loadingEl = document.getElementById("loadingMsg");
      let lastError = null;

      // المرحلة 1: تجربة جميع نماذج Gemini المتاحة في حسابك
      if (geminiKey) {
        try {
          loadingEl.innerText = "⏳ جاري فحص نماذج Gemini المتاحة...";
          const models = await getAvailableGeminiModels(geminiKey);

          const parts = imgBase64
            ? [{ text: promptText }, { inlineData: { mimeType: imgMime, data: imgBase64 } }]
            : [{ text: promptText }];

          for (const modelName of models) {
            loadingEl.innerText = `⏳ جاري التحليل عبر (${modelName})...`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${geminiKey}`;

            try {
              const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { responseMimeType: "application/json" }
                })
              });

              const data = await response.json();
              if (!response.ok) {
                lastError = new Error(`[${modelName}]: ${data.error?.message || "خطأ"}`);
                continue;
              }

              const badge = document.getElementById("usedModelBadge");
              badge.innerText = modelName;
              badge.classList.remove("hidden");

              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
              return JSON.parse(rawText);
            } catch (err) {
              lastError = err;
            }
          }
        } catch (err) {
          lastError = err;
        }
      }

      // المرحلة 2: إذا فشلت جميع نماذج Gemini أو لم يكن هناك مفتاح، انتقل تلقائياً إلى OpenRouter
      if (orKey) {
        return await callOpenRouter(promptText, imgBase64, imgMime);
      }

      throw lastError || new Error("تعذر إتمام التحليل. يمكنك إضافة مفتاح OpenRouter كخيار احتياطي.");
    }

    function getPrompt(extraNote = "") {
      return `أنت خبير تسعير ومشتريات مواد منزلية وهدايا وديكور في السوق العراقي (الموصل وبغداد).
المستخدم تاجر جملة ومفرد (مكتب أثير العريبي) يريد تقييم عروض الموردين قبل الشراء.
حلل المنتجات والأسعار الموجودة في المدخلات التالية. ${extraNote ? "ملاحظة المستخدم: " + extraNote : ""}
أرجع النتيجة حصرياً بصيغة JSON Array من الكائنات (بدون أي نص إضافي خارج المصفوفة)، بحيث يحتوي كل كائن على الحقول التالية فقط:
[
  {
    "name": "اسم المنتج والمواصفات باختصار",
    "offer_price": "السعر المعروض في الصورة/النص",
    "wholesale_price": "تقدير سعر الجملة الحقيقي في السوق العراقي (للقطعة الواحدة)",
    "retail_price": "تقدير سعر البيع بالمفرد للزبون في المحلات العراقية",
    "decision": "✅ فرصة ممتازة (ربح عالي)" أو "⚖️ سعر جملة طبيعي" أو "❌ غالي (لا يُنصح)"
  }
]`;
    }

    function renderTable(items) {
      const tbody = document.getElementById("resultTableBody");
      tbody.innerHTML = "";
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-gray-500">لم يتم العثور على منتجات واضحة.</td></tr>`;
      } else {
        items.forEach(item => {
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="p-2 font-bold text-gray-800">${item.name || "-"}</td>
              <td class="p-2 text-teal-700 font-bold">${item.offer_price || "-"}</td>
              <td class="p-2 text-blue-700 font-semibold">${item.wholesale_price || "-"}</td>
              <td class="p-2 text-gray-700 font-semibold">${item.retail_price || "-"}</td>
              <td class="p-2 font-bold">${item.decision || "-"}</td>
            </tr>
          `;
        });
      }
      document.getElementById("tableContainer").classList.remove("hidden");
    }

    async function analyzeImage() {
      if (!base64Image) return alert("يرجى اختيار صورة أولاً.");
      const note = document.getElementById("imageNote").value.trim();
      const btn = document.getElementById("btnAnalyzeImage");
      
      prepareUI(btn, true);
      try {
        const items = await runAnalysis(getPrompt(note), base64Image, imageMimeType);
        renderTable(items);
      } catch (err) {
        showError(err.message);
      } finally {
        prepareUI(btn, false, "🔍 استخرج وحلل المنتجات بالصورة");
      }
    }

    async function analyzeText() {
      const text = document.getElementById("textInput").value.trim();
      if (!text) return alert("يرجى إدخال نص القائمة أولاً.");
      const btn = document.getElementById("btnAnalyzeText");

      prepareUI(btn, true);
      try {
        const prompt = getPrompt() + "\n\nالنص المطلوب تحليله:\n" + text;
        const items = await runAnalysis(prompt);
        renderTable(items);
      } catch (err) {
        showError(err.message);
      } finally {
        prepareUI(btn, false, "🔍 حلل القائمة والأسعار");
      }
    }

    function prepareUI(btn, isLoading, defaultText = "") {
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("loadingMsg").classList.toggle("hidden", !isLoading);
      if (isLoading) {
        document.getElementById("errorMsg").classList.add("hidden");
        document.getElementById("tableContainer").classList.add("hidden");
        document.getElementById("usedModelBadge").classList.add("hidden");
        btn.disabled = true;
        btn.innerText = "⏳ جاري التحليل...";
      } else {
        btn.disabled = false;
        btn.innerText = defaultText;
      }
    }

    function showError(msg) {
      const errBox = document.getElementById("errorMsg");
      errBox.innerText = "❌ " + msg;
      errBox.classList.remove("hidden");
    }
  </script>
</body>
</html>
