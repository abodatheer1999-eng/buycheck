<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفكرة الشراء الخاصة - أبو فيروزة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #008080;
      --primary-dark: #006666;
      --bg: #f4f7f6;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: #222222;
      margin: 0;
      padding: 0;
    }
    .brand-bg { background-color: var(--primary); }
    .brand-bg:hover { background-color: var(--primary-dark); }
    .brand-text { color: var(--primary); }
    .brand-border { border-color: var(--primary); }
  </style>
</head>
<body class="pb-12">

  <!-- الشريط العلوي -->
  <header class="brand-bg text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-extrabold">مفكرة الشراء الخاصة - أبو فيروزة</h1>
        <p class="text-xs text-teal-100">فحص سريع بالصورة أو النص قبل الشراء</p>
      </div>
      <button onclick="toggleSettings()" class="bg-teal-700 hover:bg-teal-800 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 shadow-sm">
        ⚙️ المفتاح
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- صندوق إدخال المفتاح -->
    <div id="settingsBox" class="hidden bg-white p-4 rounded-xl shadow border border-teal-200">
      <label class="block text-sm font-bold brand-text mb-1">مفتاح Gemini API Key:</label>
      <div class="flex gap-2">
        <input type="password" id="apiKeyInput" placeholder="ألصق المفتاح هنا (AIzaSy...)" class="w-full border rounded-lg px-3 py-2 text-sm text-left focus:outline-none focus:border-teal-600" dir="ltr" />
        <button onclick="saveKey()" class="brand-bg text-white px-4 py-2 rounded-lg text-sm font-bold shrink-0">حفظ</button>
      </div>
      <p class="text-xs text-gray-500 mt-1">* يُحفظ في جهازك الشخصي فقط.</p>
    </div>

    <!-- التبويبات -->
    <div class="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-xl shadow-sm">
      <button id="tab-image" onclick="switchTab('image')" class="brand-bg text-white py-2 rounded-lg text-sm font-bold transition">📸 فحص صورة</button>
      <button id="tab-text" onclick="switchTab('text')" class="text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition">📝 نص / قائمة</button>
    </div>

    <!-- قسم فحص الصورة -->
    <div id="section-image" class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <label class="block text-sm font-bold text-gray-700">التقط صورة أو اختر لقطة شاشة لمنتج أو قائمة:</label>
      <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="block w-full text-sm text-gray-600 file:ml-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 border rounded-lg p-1.5" />
      
      <div id="imagePreviewContainer" class="hidden">
        <img id="imagePreview" class="max-h-60 mx-auto rounded-lg border shadow-sm object-contain" />
      </div>

      <input type="text" id="imageNote" placeholder="ملاحظة إضافية (مثلاً: الأسعار بالجملة أو بالدينار)" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-600" />
      
      <button id="btnAnalyzeImage" onclick="analyzeImage()" class="w-full brand-bg text-white py-2.5 rounded-lg font-bold text-sm shadow">
        🔍 استخرج وحلل المنتجات بالصورة
      </button>
    </div>

    <!-- قسم فحص النص -->
    <div id="section-text" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-3">
      <label class="block text-sm font-bold text-gray-700">ألصق قائمة الأسعار أو تفاصيل المنتجات هنا:</label>
      <textarea id="textInput" rows="5" placeholder="مثال:&#10;طقم بهارات 7 قطع بسعر 12,000&#10;ترمس شاي 1 لتر بسعر 9,500" class="w-full border rounded-lg p-3 text-sm focus:outline-none focus:border-teal-600"></textarea>
      
      <button id="btnAnalyzeText" onclick="analyzeText()" class="w-full brand-bg text-white py-2.5 rounded-lg font-bold text-sm shadow">
        🔍 حلل القائمة والأسعار
      </button>
    </div>

    <!-- صندوق النتائج -->
    <div id="resultBox" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-3 border-t-4 brand-border">
      <div class="flex justify-between items-center">
        <h2 class="font-extrabold text-base brand-text">نتيجة التحليل وتوصية الشراء:</h2>
        <span id="usedModelBadge" class="hidden text-[10px] bg-teal-50 text-teal-700 px-2 py-0.5 rounded-full font-bold" dir="ltr"></span>
      </div>
      
      <div id="loadingMsg" class="hidden text-center py-4 text-sm font-bold text-teal-700">
        ⏳ جاري تحليل البيانات والأسعار...
      </div>
      <div id="errorMsg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-xs font-bold leading-relaxed"></div>
      
      <div id="tableContainer" class="hidden overflow-x-auto">
        <table class="w-full text-right border-collapse text-xs">
          <thead>
            <tr class="bg-teal-50 text-teal-900 border-b">
              <th class="p-2">المنتج</th>
              <th class="p-2">سعر العرض</th>
              <th class="p-2">سعر السوق</th>
              <th class="p-2">التقييم</th>
            </tr>
          </thead>
          <tbody id="resultTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // قائمة النماذج مرتبة حسب الأولوية للانتقال التلقائي عند الضغط
    const FALLBACK_MODELS = [
      "gemini-3.8-flash",
      "gemini-3.8-flash-lite",
      "gemini-3.8-pro"
    ];

    let base64Image = "";
    let imageMimeType = "";

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      } else {
        document.getElementById("settingsBox").classList.remove("hidden");
      }
    };

    function toggleSettings() {
      document.getElementById("settingsBox").classList.toggle("hidden");
    }

    function saveKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) return alert("يرجى إدخال المفتاح أولاً.");
      localStorage.setItem("gemini_api_key", key);
      alert("✅ تم حفظ المفتاح بنجاح!");
      document.getElementById("settingsBox").classList.add("hidden");
    }

    function switchTab(tab) {
      const isImg = tab === "image";
      document.getElementById("section-image").classList.toggle("hidden", !isImg);
      document.getElementById("section-text").classList.toggle("hidden", isImg);
      
      document.getElementById("tab-image").className = isImg 
        ? "brand-bg text-white py-2 rounded-lg text-sm font-bold transition" 
        : "text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition";
      document.getElementById("tab-text").className = !isImg 
        ? "brand-bg text-white py-2 rounded-lg text-sm font-bold transition" 
        : "text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-sm font-bold transition";
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      imageMimeType = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById("imagePreview").src = e.target.result;
        document.getElementById("imagePreviewContainer").classList.remove("hidden");
        base64Image = e.target.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    async function callGemini(parts) {
      const apiKey = (localStorage.getItem("gemini_api_key") || "").trim();
      if (!apiKey) {
        document.getElementById("settingsBox").classList.remove("hidden");
        throw new Error("يرجى إدخال وحفظ مفتاح Gemini API Key أولاً.");
      }

      let lastError = null;
      const loadingEl = document.getElementById("loadingMsg");

      for (let i = 0; i < FALLBACK_MODELS.length; i++) {
        const modelName = FALLBACK_MODELS[i];
        
        if (i > 0) {
          loadingEl.innerText = `⏳ النموذج الأساسي مشغول، جاري التحويل تلقائياً إلى (${modelName})...`;
        } else {
          loadingEl.innerText = "⏳ جاري تحليل البيانات والأسعار...";
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
        
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();

          if (!response.ok) {
            const msg = data.error?.message || "خطأ غير معروف";
            // إذا كان الخطأ بسبب الضغط أو عدم توفر النموذج مؤقتاً، جرب النموذج التالي
            if (response.status === 503 || response.status === 429 || response.status === 404 || msg.toLowerCase().includes("demand") || msg.toLowerCase().includes("overloaded")) {
              lastError = new Error(msg);
              continue;
            }
            // إذا كان الخطأ في المفتاح نفسه (مثل 400 أو 403) توقف فوراً وأظهر الخطأ
            throw new Error(msg);
          }

          // نجح الاتصال: اعرض اسم النموذج المستخدم في زاوية النتيجة
          const badge = document.getElementById("usedModelBadge");
          badge.innerText = modelName;
          badge.classList.remove("hidden");

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
          return JSON.parse(rawText);

        } catch (err) {
          lastError = err;
          // إذا كان خطأ شبكة أو مفتاح غير صالح، لا داعي لتكرار المحاولة
          if (err.message.includes("API key") || err.message.includes("Failed to fetch")) {
            throw err;
          }
        }
      }

      throw lastError || new Error("جميع النماذج مشغولة حالياً، يرجى المحاولة بعد دقيقة.");
    }

    function getPrompt(extraNote = "") {
      return `أنت خبير تسعير ومشتريات مواد منزلية وهدايا في السوق العراقي (الموصل).
حلل المنتجات والأسعار الموجودة في المدخلات التالية. ${extraNote ? "ملاحظة المستخدم: " + extraNote : ""}
أرجع النتيجة حصرياً بصيغة JSON Array من الكائنات، بحيث يحتوي كل كائن على الحقول التالية فقط:
[
  {
    "name": "اسم المنتج والمواصفات باختصار",
    "offer_price": "السعر المعروض",
    "market_price": "تقدير سعر الجملة/السوق العراقي",
    "decision": "✅ فرصة ممتازة" أو "⚖️ سعر مناسب" أو "❌ غالي / لا يُنصح"
  }
]`;
    }

    function renderTable(items) {
      const tbody = document.getElementById("resultTableBody");
      tbody.innerHTML = "";
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-gray-500">لم يتم العثور على منتجات واضحة.</td></tr>`;
      } else {
        items.forEach(item => {
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="p-2 font-bold text-gray-800">${item.name || "-"}</td>
              <td class="p-2 text-teal-700 font-bold">${item.offer_price || "-"}</td>
              <td class="p-2 text-gray-600">${item.market_price || "-"}</td>
              <td class="p-2 font-bold">${item.decision || "-"}</td>
            </tr>
          `;
        });
      }
      document.getElementById("tableContainer").classList.remove("hidden");
    }

    async function analyzeImage() {
      if (!base64Image) return alert("يرجى اختيار صورة أولاً.");
      const note = document.getElementById("imageNote").value.trim();
      const btn = document.getElementById("btnAnalyzeImage");
      
      prepareUI(btn, true);
      try {
        const parts = [
          { text: getPrompt(note) },
          { inlineData: { mimeType: imageMimeType, data: base64Image } }
        ];
        const items = await callGemini(parts);
        renderTable(items);
      } catch (err) {
        showError(err.message);
      } finally {
        prepareUI(btn, false, "🔍 استخرج وحلل المنتجات بالصورة");
      }
    }

    async function analyzeText() {
      const text = document.getElementById("textInput").value.trim();
      if (!text) return alert("يرجى إدخال نص القائمة أولاً.");
      const btn = document.getElementById("btnAnalyzeText");

      prepareUI(btn, true);
      try {
        const parts = [{ text: getPrompt() + "\n\nالنص المطلوب تحليله:\n" + text }];
        const items = await callGemini(parts);
        renderTable(items);
      } catch (err) {
        showError(err.message);
      } finally {
        prepareUI(btn, false, "🔍 حلل القائمة والأسعار");
      }
    }

    function prepareUI(btn, isLoading, defaultText = "") {
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("loadingMsg").classList.toggle("hidden", !isLoading);
      if (isLoading) {
        document.getElementById("errorMsg").classList.add("hidden");
