<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مستشار المشتريات الذكي - أبو فيروزة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #008080;
      --primary-dark: #006666;
      --bg: #f4f7f6;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: #222222;
      margin: 0;
      padding: 0;
    }
    .brand-bg { background-color: var(--primary); }
    .brand-bg:hover { background-color: var(--primary-dark); }
    .brand-text { color: var(--primary); }
    .brand-border { border-color: var(--primary); }
  </style>
</head>
<body class="pb-16">

  <!-- الشريط العلوي -->
  <header class="brand-bg text-white p-3.5 shadow-md sticky top-0 z-20">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base font-extrabold">مستشار المشتريات وبنك الموردين</h1>
        <p class="text-[11px] text-teal-100">مكتب أثير العريبي • فحص فوري وحماية السيولة</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="toggleArchive()" class="bg-teal-800 hover:bg-teal-900 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm">
          📒 الأرشيف (<span id="archiveCount">0</span>)
        </button>
        <button onclick="toggleSettings()" class="bg-teal-700 hover:bg-teal-800 px-2.5 py-1.5 rounded-lg text-xs font-bold shadow-sm">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-3.5 space-y-3.5">

    <!-- صندوق إدخال المفاتيح -->
    <div id="settingsBox" class="hidden bg-white p-4 rounded-xl shadow border border-teal-200 space-y-3">
      <div>
        <label class="block text-xs font-bold brand-text mb-1">1. مفتاح Gemini API Key (الأساسي):</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full border rounded-lg px-3 py-2 text-xs text-left focus:outline-none focus:border-teal-600" dir="ltr" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">2. مفتاح OpenRouter API Key (احتياطي):</label>
        <input type="password" id="openRouterKeyInput" placeholder="sk-or-..." class="w-full border rounded-lg px-3 py-2 text-xs text-left focus:outline-none focus:border-teal-600" dir="ltr" />
      </div>
      <div class="flex justify-end">
        <button onclick="saveKeys()" class="brand-bg text-white px-4 py-1.5 rounded-lg text-xs font-bold">حفظ المفاتيح</button>
      </div>
    </div>

    <!-- صندوق بنك أسعار الموردين (شركة الهدى وغيرها) -->
    <div id="archiveBox" class="hidden bg-white p-4 rounded-xl shadow border border-amber-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-sm font-extrabold text-amber-800">📒 بنك أسعار الموردين المحفوظة</h2>
        <button onclick="clearArchive()" class="text-[11px] text-red-600 font-bold underline">مسح الكل</button>
      </div>
      <input type="text" id="archiveSearch" oninput="renderArchiveList()" placeholder="ابحث باسم الصنف أو اسم المورد (مثلاً: الهدى)..." class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-amber-500" />
      <div id="archiveList" class="max-h-64 overflow-y-auto divide-y text-xs"></div>
    </div>

    <!-- التبويبات -->
    <div class="grid grid-cols-2 gap-2 bg-white p-1 rounded-xl shadow-sm">
      <button id="tab-image" onclick="switchTab('image')" class="brand-bg text-white py-2 rounded-lg text-xs font-bold transition">📸 تصوير عند المورد</button>
      <button id="tab-text" onclick="switchTab('text')" class="text-gray-600 hover:bg-gray-100 py-2 rounded-lg text-xs font-bold transition">📝 كتابة / لصق سعر</button>
    </div>

    <!-- أزرار الاختيار السريع للمنشأ والحجم والمورد -->
    <div class="bg-white p-3 rounded-xl shadow-sm space-y-2.5">
      <div>
        <span class="block text-[11px] font-bold text-gray-500 mb-1">المنشأ:</span>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="selectChip('origin', 'تلقائي', this)" class="chip-origin bg-teal-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold">تلقائي</button>
          <button type="button" onclick="selectChip('origin', 'صيني', this)" class="chip-origin bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">🇨🇳 صيني</button>
          <button type="button" onclick="selectChip('origin', 'إيراني', this)" class="chip-origin bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">🇮🇷 إيراني</button>
          <button type="button" onclick="selectChip('origin', 'تركي', this)" class="chip-origin bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">🇹🇷 تركي</button>
          <button type="button" onclick="selectChip('origin', 'عراقي', this)" class="chip-origin bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">🇮🇶 عراقي</button>
        </div>
      </div>

      <div>
        <span class="block text-[11px] font-bold text-gray-500 mb-1">الحجم / النوع:</span>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="selectChip('size', 'تلقائي', this)" class="chip-size bg-teal-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold">تلقائي</button>
          <button type="button" onclick="selectChip('size', 'صغير', this)" class="chip-size bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">صغير</button>
          <button type="button" onclick="selectChip('size', 'وسط', this)" class="chip-size bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">وسط</button>
          <button type="button" onclick="selectChip('size', 'كبير', this)" class="chip-size bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">كبير</button>
          <button type="button" onclick="selectChip('size', 'سيت كامل', this)" class="chip-size bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">سيت كامل</button>
          <button type="button" onclick="selectChip('size', 'زجاج/قابل للكسر', this)" class="chip-size bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">🍷 قابل للكسر</button>
        </div>
      </div>

      <!-- بيانات المخزن المصغرة (لمحاكاة الربط مع نظام العريبي) -->
      <div class="grid grid-cols-2 gap-2 pt-1 border-t">
        <div>
          <label class="block text-[10px] font-bold text-gray-500 mb-0.5">اسم المورد الحالي:</label>
          <input type="text" id="supplierNameInput" placeholder="مثلاً: شركة الهدى" class="w-full border rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-teal-600 bg-gray-50" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-500 mb-0.5">رصيدك الحالي بالمحل (اختياري):</label>
          <input type="number" id="currentStockInput" placeholder="0" class="w-full border rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-teal-600 bg-gray-50" />
        </div>
      </div>
    </div>

    <!-- قسم فحص الصورة -->
    <div id="section-image" class="bg-white p-3.5 rounded-xl shadow-sm space-y-3">
      <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewAndCompressImage(event)" class="block w-full text-xs text-gray-600 file:ml-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-teal-600 file:text-white hover:file:bg-teal-700 border rounded-lg p-1.5" />
      
      <div id="imagePreviewContainer" class="hidden text-center">
        <img id="imagePreview" class="max-h-48 mx-auto rounded-lg border shadow-sm object-contain" />
        <p id="imageSizeInfo" class="text-[10px] text-teal-700 font-bold mt-1"></p>
      </div>

      <input type="text" id="imageNote" placeholder="سعر المورد أو ملاحظة (مثلاً: بـ 3500 أو كرتون 24 قطعة)" class="w-full border rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-teal-600" />
      
      <button id="btnAnalyzeImage" onclick="analyzeImage()" class="w-full brand-bg text-white py-3 rounded-xl font-extrabold text-sm shadow-md">
        ⚡ افحص القرار والكمية الذهبية
      </button>
    </div>

    <!-- قسم فحص النص -->
    <div id="section-text" class="hidden bg-white p-3.5 rounded-xl shadow-sm space-y-3">
      <textarea id="textInput" rows="3" placeholder="اكتب اسم المنتج وسعر المورد هنا...&#10;مثال: ترمس شاي إيراني 1 لتر سعر المورد 8500" class="w-full border rounded-lg p-2.5 text-xs focus:outline-none focus:border-teal-600"></textarea>
      
      <button id="btnAnalyzeText" onclick="analyzeText()" class="w-full brand-bg text-white py-3 rounded-xl font-extrabold text-sm shadow-md">
        ⚡ افحص القرار والكمية الذهبية
      </button>
    </div>

    <!-- صندوق بطاقات القرار السريعة -->
    <div id="resultBox" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-extrabold brand-text">نتيجة التحليل الاقتصادي والميداني:</span>
        <span id="usedModelBadge" class="hidden text-[10px] bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full font-bold" dir="ltr"></span>
      </div>

      <div id="loadingMsg" class="hidden bg-white p-6 rounded-xl shadow-sm text-center text-sm font-bold text-teal-700">
        ⚡ جاري حساب السعر الصافي، الموسم، والكمية المثالية...
      </div>

      <div id="errorMsg" class="hidden bg-red-50 text-red-700 p-3 rounded-xl text-xs font-bold border border-red-200" dir="ltr"></div>

      <!-- حاوية البطاقات الذكية -->
      <div id="cardsContainer" class="space-y-3"></div>
    </div>

  </main>

  <script>
    const OPENROUTER_MODELS = [
      "google/gemini-2.0-flash-exp:free",
      "qwen/qwen-2.5-vl-7b-instruct:free",
      "openai/gpt-4o-mini"
    ];

    let base64Image = "";
    let imageMimeType = "image/jpeg";
    let selectedOrigin = "تلقائي";
    let selectedSize = "تلقائي";
    let lastAnalyzedItems = [];

    window.onload = () => {
      const savedGemini = localStorage.getItem("gemini_api_key");
      const savedOR = localStorage.getItem("openrouter_api_key");
      if (savedGemini) document.getElementById("apiKeyInput").value = savedGemini;
      if (savedOR) document.getElementById("openRouterKeyInput").value = savedOR;
      if (!savedGemini && !savedOR) document.getElementById("settingsBox").classList.remove("hidden");
      updateArchiveCount();
    };

    function selectChip(type, val, el) {
      if (type === "origin") selectedOrigin = val;
      if (type === "size") selectedSize = val;
      document.querySelectorAll(`.chip-${type}`).forEach(btn => {
        btn.className = `chip-${type} bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold`;
      });
      el.className = `chip-${type} bg-teal-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold`;
    }

    function toggleSettings() {
      document.getElementById("settingsBox").classList.toggle("hidden");
    }

    function toggleArchive() {
      const box = document.getElementById("archiveBox");
      box.classList.toggle("hidden");
      if (!box.classList.contains("hidden")) renderArchiveList();
    }

    function saveKeys() {
      const geminiKey = document.getElementById("apiKeyInput").value.trim();
      const orKey = document.getElementById("openRouterKeyInput").value.trim();
      if (!geminiKey && !orKey) return alert("يرجى إدخال مفتاح واحد على الأقل.");
      localStorage.setItem("gemini_api_key", geminiKey);
      localStorage.setItem("openrouter_api_key", orKey);
      localStorage.removeItem("cached_fast_gemini_model");
      alert("✅ تم الحفظ!");
      document.getElementById("settingsBox").classList.add("hidden");
    }

    function switchTab(tab) {
      const isImg = tab === "image";
      document.getElementById("section-image").classList.toggle("hidden", !isImg);
      document.getElementById
